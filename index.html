    <!-- Self-hosted Inter (latin) — precached by the PWA; no Google Fonts round-trip.
         Only preload the body weight; 600/700 load via font-display:swap so tablets
         spend early bandwidth on JS/CSS instead of three competing font fetches. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
