name: CI

on:
  push:
    branches: [main, development, alpha]
  pull_request:
    branches: [main, development, alpha]
  workflow_dispatch:
    inputs:
      cross_browser:
        description: 'Run opt-in WebKit / Firefox / iPad WebKit e2e smoke'
        type: boolean
        default: false
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: TypeScript type checking
        run: npx tsc --noEmit

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build project
        run: npm run build
      - name: Verify dist artifacts
        run: |
          test -d dist || (echo "::error::dist/ not produced"; exit 1)
          test -f dist/health.txt || (echo "::error::dist/health.txt missing"; exit 1)
          echo "Build artifacts OK"
      - name: Enforce JS chunk size budget
        run: |
          set -euo pipefail
          limit_kb=250
          oversized="$(
            find dist/assets -name '*.js' -printf '%s %p\n' |
            awk -v limit="$limit_kb" '{
              kb = $1 / 1024
              if (kb > limit) printf "%.2f kB  %s\n", kb, $2
            }'
          )"
          if [ -n "${oversized}" ]; then
            echo "::error::JS chunk(s) exceed ${limit_kb} kB budget:"
            echo "${oversized}"
            exit 1
          fi
          echo "All JS chunks under ${limit_kb} kB"
      - name: Report gzip bundle budgets (non-blocking)
        continue-on-error: true
        run: npm run size:check

  # Unit suite pruned from ~5k TOKENMAXX files; target wall time under ~5 min.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests
        timeout-minutes: 8
        run: |
          set -euo pipefail
          count="$(find tests/unit \( -name '*.test.ts' -o -name '*.spec.ts' \) ! -path '*/_tokenmaxx_archive/*' | wc -l | tr -d ' ')"
          echo "unit suite: ${count} files (budget ~5 min; step timeout 8m / job 10m)"
          npm run test:unit

  # Browser smoke + mp3d board3d guards; pruned TOKENMAXX chrome leftovers.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        timeout-minutes: 12
        run: |
          set -euo pipefail
          count="$(find tests/e2e -name '*.spec.ts' | wc -l | tr -d ' ')"
          echo "e2e suite: ${count} files (smoke + bug-guards + mp3d)"
          npm run test:e2e -- --project=chromium --project=mobile-iphone-se --project=mobile-pixel-7
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Opt-in WebKit / Firefox / iPad WebKit smoke. Not required on PRs.
  # Enable via repo variable CROSS_BROWSER_E2E=true, or workflow_dispatch input.
  e2e-cross-browser:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cross_browser == true || vars.CROSS_BROWSER_E2E == 'true' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers (firefox + webkit)
        run: npx playwright install --with-deps firefox webkit
      - name: Run cross-browser e2e smoke
        timeout-minutes: 40
        env:
          CROSS_BROWSER: '1'
        run: |
          set -euo pipefail
          npm run test:e2e:cross -- tests/e2e/smoke.spec.ts
      - name: Upload cross-browser Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-cross-browser
          path: playwright-report/
          retention-days: 30

  # Visual baselines (start screen + each game opening @ desktop + phone).
  # Report-only for now: failures upload artifacts but do not fail the workflow.
  visual-baseline:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run visual regression (report-only)
        id: visual
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          echo "visual-baseline: report-only — see docs/wiki/development.md#visual-regression-baselines"
          npm run test:e2e:visual
      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v7
        if: failure() || steps.visual.outcome == 'failure'
        with:
          name: visual-baseline-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Surface report-only result
        if: steps.visual.outcome == 'failure'
        run: |
          echo "::warning::visual-baseline diffs detected (report-only; workflow stays green)"
          exit 0
