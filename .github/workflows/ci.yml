name: CI

on:
  push:
    branches: [main, development, alpha]
  pull_request:
    branches: [main, development, alpha]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: TypeScript type checking
        run: npx tsc --noEmit

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build project
        run: npm run build
      - name: Verify dist artifacts
        run: |
          test -d dist || (echo "::error::dist/ not produced"; exit 1)
          test -f dist/health.txt || (echo "::error::dist/health.txt missing"; exit 1)
          echo "Build artifacts OK"
      - name: Enforce JS chunk size budget
        run: |
          set -euo pipefail
          limit_kb=250
          oversized="$(
            find dist/assets -name '*.js' -printf '%s %p\n' |
            awk -v limit="$limit_kb" '{
              kb = $1 / 1024
              if (kb > limit) printf "%.2f kB  %s\n", kb, $2
            }'
          )"
          if [ -n "${oversized}" ]; then
            echo "::error::JS chunk(s) exceed ${limit_kb} kB budget:"
            echo "${oversized}"
            exit 1
          fi
          echo "All JS chunks under ${limit_kb} kB"

  # TOKENMAXX left ~5k unit files; healthy GHA p90 is ~30 min with little Vitest
  # stdout after npm ci (looks hung). Job/step caps fail loudly past budget;
  # heartbeat notices keep the log from looking stuck during a healthy run.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests
        timeout-minutes: 40
        run: |
          set -euo pipefail
          count="$(find tests/unit \( -name '*.test.ts' -o -name '*.spec.ts' \) | wc -l | tr -d ' ')"
          echo "unit suite: ${count} files (expected p90 ~30 min; step timeout 40m / job 45m)"
          (
            elapsed=0
            while sleep 300; do
              elapsed=$((elapsed + 5))
              echo "::notice::unit suite still running (~${elapsed} min elapsed; expected ~25-35 min, fails at 40m step / 45m job)"
            done
          ) &
          heartbeat_pid=$!
          cleanup() { kill "${heartbeat_pid}" 2>/dev/null || true; }
          trap cleanup EXIT
          npm run test:unit
          cleanup
          trap - EXIT

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e -- --project=chromium
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
