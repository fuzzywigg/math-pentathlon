name: CI

on:
  push:
    branches: [main, development, alpha]
  pull_request:
    # Base-branch filter: stacked draft PRs targeting cursor/** also get CI.
    branches: [main, development, alpha, 'cursor/**']
  # Manual re-runs (cross-browser is always report-only on PR/push; no toggle needed).
  workflow_dispatch:

# Least privilege: every job only needs to read the repo checkout.
# No job needs contents: write, deployments, or pull-requests scopes.
# (upload-artifact already succeeds under this permission set on this repo.)
permissions:
  contents: read

# Cancel superseded runs on the same PR (or branch for push/dispatch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Same chain as package.json "verify" (lint → lint:ratchet → format:check →
      # typecheck → typecheck:ratchet → check:boundaries). Keep CI and local aligned.
      - run: npm run verify
      # Report-only: surface player-facing copy-pin findings in Actions without
      # failing the required lint job (q-mp-137). Stays outside package.json
      # "verify" so verify consolidation and copy-pins can fold together.
      - name: Player-facing copy pins (report-only)
        continue-on-error: true
        run: npm run check:copy-pins -- --fail

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: audit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build project
        run: npm run build
      - name: Verify dist artifacts
        run: |
          test -d dist || (echo "::error::dist/ not produced"; exit 1)
          test -f dist/health.txt || (echo "::error::dist/health.txt missing"; exit 1)
          echo "Build artifacts OK"
      - name: Enforce JS chunk size budget
        run: |
          set -euo pipefail
          limit_kb=250
          oversized="$(
            find dist/assets -name '*.js' -printf '%s %p\n' |
            awk -v limit="$limit_kb" '{
              kb = $1 / 1024
              if (kb > limit) printf "%.2f kB  %s\n", kb, $2
            }'
          )"
          if [ -n "${oversized}" ]; then
            echo "::error::JS chunk(s) exceed ${limit_kb} kB budget:"
            echo "${oversized}"
            exit 1
          fi
          echo "All JS chunks under ${limit_kb} kB"
      # Report-only ratchet: --fail-on-new-over exits 1 on novel OVER rows, but
      # continue-on-error keeps the required build job green (q-mp-123).
      - name: Report gzip bundle budgets (non-blocking)
        continue-on-error: true
        run: npm run size:check -- --fail-on-new-over
      # Report-only: parses dist/site.webmanifest after build (burn-1008-mp-pwa-manifest).
      - name: PWA manifest installability contract (report-only)
        continue-on-error: true
        run: npm run check:pwa-manifest

  # Unit suite pruned from ~5k TOKENMAXX files; tip fold suite targets ~8 min
  # on GHA (AI benches skipped under CI; see *.bench.test.ts skipIf).
  # q-mp-142: matrix by vitest project (unit-shared / unit-node / unit-isolated)
  # so each shard keeps the same 12m step / 14m job budgets without raising
  # timeouts. Local full-suite parity remains `npm run test:unit`.
  # Docs: docs/dev/ci-unit-shards-q-mp-142.md
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        project: [unit-shared, unit-node, unit-isolated]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run unit tests (${{ matrix.project }})
        timeout-minutes: 12
        run: |
          set -euo pipefail
          count="$(find tests/unit \( -name '*.test.ts' -o -name '*.spec.ts' \) ! -path '*/_tokenmaxx_archive/*' | wc -l | tr -d ' ')"
          echo "unit suite: ${count} files total; shard project=${{ matrix.project }} (budget ~8 min; step timeout 12m / job 14m)"
          npm run test:unit -- --project ${{ matrix.project }}

  # Browser smoke + mp3d board3d guards; pruned TOKENMAXX chrome leftovers.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run e2e tests
        timeout-minutes: 12
        run: |
          set -euo pipefail
          count="$(find tests/e2e -name '*.spec.ts' ! -path '*/fullgame/*' | wc -l | tr -d ' ')"
          echo "e2e suite: ${count} files (smoke + bug-guards + mp3d; @fullgame excluded)"
          npm run test:e2e:chromium
      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Fullgame HvH: one complete human-vs-human match per game (Chromium).
  # Report-only: failures upload artifacts but do not fail the workflow.
  # Task: burn-1007-mp-e2e-fullgame
  e2e-fullgame:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run fullgame HvH e2e (report-only)
        id: fullgame
        continue-on-error: true
        timeout-minutes: 110
        run: |
          set -euo pipefail
          count="$(find tests/e2e/fullgame -name '*.spec.ts' | wc -l | tr -d ' ')"
          echo "e2e-fullgame: report-only — ${count} specs (burn-1007-mp-e2e-fullgame)"
          npm run test:e2e:fullgame
      - name: Upload fullgame Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fullgame-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Surface report-only result
        if: steps.fullgame.outcome == 'failure'
        run: |
          echo "::warning::fullgame findings or timeouts (report-only; workflow stays green)"
          exit 0

  # Phone + tablet touch smoke (iPhone 13 / Pixel 7 / iPad). Report-only:
  # failures upload artifacts but do not fail the workflow.
  mobile-touch:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run mobile touch smoke (report-only)
        id: mobile
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set -euo pipefail
          echo "mobile-touch: report-only — see docs/mobile-2026-10-07.md"
          npm run test:e2e:mobile
      - name: Upload mobile touch artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-touch-report
          path: |
            test-results/mobile/
            playwright-report/
          retention-days: 14
      - name: Surface report-only result
        if: steps.mobile.outcome == 'failure'
        run: |
          echo "::warning::mobile-touch findings or timeouts (report-only; workflow stays green)"
          exit 0

  # WCAG 1.4.4 / 1.4.10 zoom + reflow audit (Chromium). Report-only:
  # findings upload as artifacts but do not fail the workflow.
  zoom-reflow:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run zoom/reflow a11y audit (report-only)
        id: zoom
        continue-on-error: true
        timeout-minutes: 55
        run: |
          set -euo pipefail
          echo "zoom-reflow: report-only — see docs/zoom-reflow-2026-10-08.md"
          npm run test:e2e:zoom-reflow
      - name: Upload zoom-reflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zoom-reflow-report
          path: |
            test-results/zoom-reflow/
            playwright-report/
          retention-days: 14
      - name: Surface report-only result
        if: steps.zoom.outcome == 'failure'
        run: |
          echo "::warning::zoom-reflow findings or timeouts (report-only; workflow stays green)"
          exit 0

  # Forced-colors + reduced-motion + color-scheme smoke (Chromium).
  # Report-only: screenshots/JSON under test-results/forced-colors; does not
  # fail the workflow. Task: burn-1008-mp-forced-colors
  forced-colors:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run forced-colors smoke (report-only)
        id: forced
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -euo pipefail
          echo "forced-colors: report-only — see docs/forced-colors-2026-10-08.md"
          npm run test:e2e:forced-colors
      - name: Upload forced-colors artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: forced-colors-report
          path: |
            test-results/forced-colors/
            playwright-report/
          retention-days: 14
      - name: Surface report-only result
        if: steps.forced.outcome == 'failure'
        run: |
          echo "::warning::forced-colors findings or timeouts (report-only; workflow stays green)"
          exit 0

  # Report-only Firefox + WebKit e2e (full suite). Does not block merges.
  # Runs after a successful build on every PR/push (and workflow_dispatch).
  # continue-on-error keeps the required Chromium path green while we triage.
  e2e-cross-browser:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ff-wk-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers (firefox + webkit)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox webkit
      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox webkit
      - name: Run cross-browser e2e (report-only)
        timeout-minutes: 55
        env:
          CROSS_BROWSER: '1'
        run: |
          set -euo pipefail
          count="$(find tests/e2e -name '*.spec.ts' ! -name 'mobile-touch-smoke.spec.ts' ! -name 'visual-baseline.spec.ts' ! -name 'zoom-reflow-a11y.spec.ts' ! -name 'forced-colors-a11y.spec.ts' ! -path '*/fullgame/*' | wc -l | tr -d ' ')"
          echo "cross-browser e2e (report-only): ${count} specs × firefox + webkit"
          npm run test:e2e -- --project=firefox --project=webkit
      - name: Upload cross-browser Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-cross-browser
          path: playwright-report/
          retention-days: 30

  # Knip unused-export drift vs docs/dev/knip-baseline.json (q-mp-118).
  # Report-only: annotates growth; never fails required lint/unit/build/e2e.
  # Tip-owner may later set enforce:true in the baseline (ratchets only go down).
  knip:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Knip unused-export drift (report-only)
        id: knip
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "knip: report-only — see docs/dev/knip-report.md"
          npm run report:knip
      - name: Surface report-only result
        if: steps.knip.outcome == 'failure'
        run: |
          echo "::warning::knip report step failed unexpectedly (report-only; workflow stays green)"
          exit 0

  # Visual baselines (start screen + each game opening @ desktop + phone).
  # Report-only for now: failures upload artifacts but do not fail the workflow.
  visual-baseline:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run visual regression (report-only)
        id: visual
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          echo "visual-baseline: report-only — see docs/wiki/development.md#visual-regression-baselines"
          npm run test:e2e:visual
      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || steps.visual.outcome == 'failure'
        with:
          name: visual-baseline-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Surface report-only result
        if: steps.visual.outcome == 'failure'
        run: |
          echo "::warning::visual-baseline diffs detected (report-only; workflow stays green)"
          exit 0
