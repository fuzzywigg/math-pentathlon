name: Feature
description: New capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game
      options: [Hex, StarTrack, Contig, Kings, Quadraphages, Core/Shared, All]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options: [XS, S, M, L, XL]
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options: [Backlog, Ready, "In Progress", Blocked]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What should this do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
