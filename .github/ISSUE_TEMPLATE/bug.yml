name: Bug
description: Something isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game
      options: [Hex, StarTrack, Contig, Kings, Quadraphages, Core/Shared]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options: [XS, S, M, L, XL]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: context
    attributes:
      label: Additional context
